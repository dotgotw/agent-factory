name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ① Contract drift:重新生成型別,若與 commit 的版本不同就失敗。
      #    擋掉「手改 generated/」與「改了 contract 卻忘記重新生成」。
      - name: Contract drift
        run: npm run check:drift

      # ② 三個 scope 各自 typecheck。contract 與實作不一致會在這裡爆。
      - name: Typecheck
        run: npm run typecheck

      # ③ 黑箱驗收測試。
      - name: E2E
        run: npm run test:e2e

  scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ④ 路徑邊界。角色從 PR label 取得(例如 label: agent:backend)。
      #    這是把 AGENTS.md 的「請求」變成 CI 的「保證」。
      - name: Path scope
        run: |
          ROLE=$(echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' \
            | grep -o 'agent:[a-z]*' | head -1 | cut -d: -f2)
          if [ -z "$ROLE" ]; then
            echo "❌ PR 缺少 agent:<role> label"
            exit 1
          fi
          git fetch origin ${{ github.base_ref }}
          node scripts/check-scope.mjs "$ROLE" "origin/${{ github.base_ref }}"
