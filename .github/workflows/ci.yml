name: CI

on:
  pull_request:
    # labeled / unlabeled 是必要的:預設觸發條件不含它們,
    # 導致「PR 開好之後才補 label」不會重跑檢查,邊界形同未驗。
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# ⚠️  verify 與 scope 兩個 job 必須「都是」required check。
#
#     ADR-002 之後,generated/ 不再由任何角色擁有:scope 只確認「這個角色的 PR
#     有資格夾帶它」,內容對不對改由 verify 裡的 check:drift 重新生成後比對。
#     兩個保證分屬兩個 job,少了任何一個,另一個都不足以守住 generated/。
#
#     最危險的是拿掉 verify:scope 仍然綠燈,PR 仍然過,但 generated/ 的內容
#     從此沒有人在看 —— 這個放寬會**靜默**變成漏洞,不會有任何一條紅線提醒你。
#     見 contract/decisions/ADR-002-derived-artifacts-guarded-by-regeneration.md
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm 必須在 setup-node 之前 —— cache: pnpm 要靠它才找得到 store 路徑。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # --frozen-lockfile:lockfile 與 package.json 對不上就失敗,不要自作主張改。
      - run: pnpm install --frozen-lockfile

      # ⓪ 擁有權規則。scope.json 的歸屬矩陣改動會不會靜默拿掉某個角色的鎖。
      #    這一步必須在 scope job 之外也跑:scope job 只驗「這張 PR 的檔案
      #    符不符合它宣告的角色」,驗不到「規則本身被改壞了」。
      - name: Ownership rules
        run: pnpm test:scope

      # ① Contract drift:重新生成型別,若與 commit 的版本不同就失敗。
      #    擋掉「手改 generated/」與「改了 contract 卻忘記重新生成」。
      - name: Contract drift
        run: pnpm check:drift

      # ② CR 與 tasks.yaml 的一致性。
      #    CR 狀態是 markdown 文字,沒有 schema 保護,靠人眼看不出漂移。
      #    擋掉「CR 已 accepted 但任務還卡著」與非法的狀態寫法。
      - name: CR consistency
        run: pnpm check:cr

      # ③ 三個 scope 各自 typecheck。contract 與實作不一致會在這裡爆。
      - name: Typecheck
        run: pnpm typecheck

      # ④ 黑箱驗收測試。
      - name: E2E
        run: pnpm test:e2e

  scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⑤ 路徑邊界。角色從 PR label 取得(例如 label: agent:backend)。
      #    這是把 AGENTS.md 的「請求」變成 CI 的「保證」。
      #
      #    必須「恰好一個」agent:* label。多個 label 並不會取得權限聯集
      #    (所有檔案仍須符合單一角色),但究竟以哪個為準取決於 label 順序,
      #    結果不可預期 —— 故直接拒絕,要求明確宣告。
      - name: Path scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 由 API 即時查詢 label,而非用事件 payload 的快照。
          # payload 在事件觸發當下就固定,若 PR 建立後才補上 label
          # (`gh pr create --label` 正是如此),payload 會是空陣列。
          # 這在 #9 實際發生過:LABELS 為 [],檢查誤報「缺少 label」。
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          ROLES=$(printf '%s' "$LABELS" | grep -o 'agent:[a-z]*' | sort -u)
          COUNT=$(printf '%s' "$ROLES" | grep -c . || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ PR 缺少 agent:<role> label"
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "❌ PR 掛了 $COUNT 個角色 label:"
            # 不依賴 unquoted 展開的字詞分割 —— zsh 與 bash 行為不同。
            printf '%s\n' "$ROLES" | sed 's/^/   - /'
            echo ""
            echo "   一個 PR 只能屬於一個角色。跨角色的變更請拆成多個 PR,"
            echo "   否則邊界檢查只會驗證其中一個角色,形同虛設。"
            exit 1
          fi

          ROLE=${ROLES#agent:}
          echo "角色 label: $ROLES"
          git fetch origin ${{ github.base_ref }}
          node scripts/check-scope.mjs "$ROLE" "origin/${{ github.base_ref }}"
