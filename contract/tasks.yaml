# 任務狀態機。用 YAML 而非 markdown,因為狀態與依賴需要能被腳本查詢。
# status: todo | in_progress | blocked | review | done
#
# 每一條 acceptance 必須宣告 verified_by,見 change-requests/CR-006.md:
#   e2e    — 由 e2e/*.spec.ts 自動驗收。任務進入 done 時,scripts/check-ac.mjs
#            會要求 e2e 裡找得到這個 AC 編號,找不到就紅。
#   manual — 黑箱 e2e 架構上打不到(例如純畫面的驗收)。必須附 verified_note
#            寫明為什麼,讓「這條沒有自動化測試」是讀得到的事實而不是默契。
#
# 刻意沒有 "none" 這個值。少寫一條測試不會讓 CI 變紅,它讓 CI 變得更綠 ——
# 這種漂移是單向的,給一個零成本的逃生門等於把它制度化。

# verified_by: manual 的 AC,在任務進入 done 時必須附一筆 verified_record
# (CR-011 裁決)。verified_note 記的是「為什麼自動化測不到」,verified_record
# 記的是「那次人工驗收發生過」—— 兩件事,不共用欄位。
#
#   verified_record:
#     at: 2026-09-01          # 驗收日期
#     who: zozo0526           # 誰驗的
#     commit: 48dc54a         # 驗的是哪個版本 —— 沒有這個欄位,紀錄會靜默過期
#     saw: 建一筆後列表顯示名稱、active、2026/9/1
#
# saw 寫的是**看到什麼**,不是複述 text。複述等於沒驗,check:ac 會擋。
#
# 這筆紀錄擋的是「忘了驗就標 done」,擋不住假簽 —— 那層是 CODEOWNERS 要求的
# 人類 review。也別把它做得更重(截圖、簽章):成本落在每一次驗收,擋到的
# 東西不會比「有沒有這筆紀錄」多。
#
# commit 讓過期變成可偵測的:owner 的路徑在那個 commit 之後改過,這筆紀錄就
# 不再對應現在的程式碼。那是提醒不是紅燈 —— 人工複驗要花人的時間,每次改
# frontend 都紅會製造噪音,而噪音的下場是被繞掉。代價要說清楚:**manual 的
# done 是快照,e2e 的 done 是活的**,兩者強度不同。

tasks:
  - id: TASK-001
    title: 建立專案 API
    owner: backend
    status: done
    depends_on: []
    contract_refs:
      - "openapi.yaml#/paths/~1projects/post"
    acceptance:
      - id: AC-001
        text: 新專案建立後回 201,狀態為 active,且含 id 與 createdAt
        verified_by: e2e
      - id: AC-002
        text: 名稱為空或全空白時回 400,code 為 VALIDATION_ERROR
        verified_by: e2e

  - id: TASK-002
    title: 專案列表與單筆查詢
    owner: backend
    status: done
    depends_on: [TASK-001]
    contract_refs:
      - "openapi.yaml#/paths/~1projects/get"
      - "openapi.yaml#/paths/~1projects~1{projectId}/get"
    acceptance:
      - id: AC-003
        text: 建立後的專案可於列表查得
        verified_by: e2e
      - id: AC-004
        text: 查詢不存在的 id 回 404,code 為 NOT_FOUND
        verified_by: e2e

  - id: TASK-003
    title: 專案列表畫面
    owner: frontend
    # AC-005/AC-006 於 2026-09-01 人工驗收,紀錄見下面的 verified_record
    # (制度的第一筆)。#54 讓 check:ac 真的驗得到那筆紀錄之後才翻 done ——
    # 這個 done 是第一個「被機制看過」的 manual done,見 CR-011 裁決。
    status: done
    depends_on: []   # 對 contract 開發,不需等 backend
    contract_refs:
      - "openapi.yaml#/components/schemas/Project"
    acceptance:
      - id: AC-005
        text: 顯示名稱、狀態、建立日期
        verified_by: manual
        verified_note: 黑箱 e2e 只 spawn backend 發 HTTP,打不到畫面;見 CR-006
        verified_record:
          at: 2026-09-01
          who: zozo0526
          commit: 533874a
          saw: 用 pnpm dev:frontend 建立「ruggetch v2」後,列表該筆同時顯示名稱 ruggetch v2、狀態 ACTIVE、建立日期 2026/9/1
      - id: AC-006
        text: 無資料時顯示空狀態
        verified_by: manual
        verified_note: 空狀態是純畫面的條件,改寫成 API 層的斷言就不是原本那條 AC 了
        verified_record:
          at: 2026-09-01
          who: zozo0526
          commit: 533874a
          saw: 剛啟動、尚未建立任何專案時,列表位置顯示斜體的「尚無專案」四個字(不是空白區塊)

  - id: TASK-004
    title: 專案封存功能
    owner: backend
    # CR-001 已 accepted,PATCH /projects/{projectId} 就緒,解除阻擋。
    # 實作 #56,AC-007 的 e2e 測試 #61(e2e/archive.spec.ts)。
    # check:ac 現在看得到 AC-007 的覆蓋,狀態才進 done —— 不是「有人覺得
    # 做完了」,是測試每次 CI 都重跑一遍。
    status: done
    depends_on: [TASK-002]
    contract_refs:
      - "openapi.yaml#/paths/~1projects~1{projectId}/patch"
    acceptance:
      - id: AC-007
        text: 封存後狀態變為 archived,且不出現在 status=active 的列表中
        verified_by: e2e

  - id: TASK-005
    title: 專案負責人通知
    owner: backend
    # 這張本來驗不了,兩個洞:ownerEmail 沒有寫入路徑(CR-002 只加了回應
    # 欄位),而「寄出通知」在黑箱裡看不到。ADR-004 兩個都補了 ——
    # CreateProjectRequest 可帶 ownerEmail,Project 多一個唯讀的
    # lastNotifiedAt 當作通知這件事的可觀察面。
    #
    # AC 的措辭因此改成「可觀察的結果」而不是「內部發生了什麼」:e2e 驗不了
    # 「信寄出去了」,驗得了「lastNotifiedAt 更新了」。改的是驗收方式,
    # 不是驗收意圖。
    #
    # 實作 #64,由 architect 實測三條 AC 全部成立(帶 ownerEmail 異動後
    # lastNotifiedAt 有值、同狀態再 PATCH 不變、換狀態才更新、無 ownerEmail
    # 回 200 且欄位不存在)。review 而不是 done —— 等 qa 補測試。
    status: review
    depends_on: [TASK-002]
    contract_refs:
      - "openapi.yaml#/paths/~1projects~1{projectId}/patch"
      - "openapi.yaml#/components/schemas/Project"
    acceptance:
      - id: AC-008
        text: 設有 ownerEmail 的專案狀態異動後,回應的 lastNotifiedAt 更新為該次通知時間
        verified_by: e2e
      - id: AC-009
        text: 未設 ownerEmail 時略過通知,PATCH 仍回 200 且不出現 lastNotifiedAt
        verified_by: e2e
      - id: AC-014
        text: 狀態未實際改變(如 active 改為 active)時不通知,lastNotifiedAt 不變
        verified_by: e2e

  - id: TASK-006
    title: 列表分頁實作(CR-003 階段二)
    owner: backend
    status: done   # 實作見 #9,驗收測試見 #11
    depends_on: [TASK-002]
    contract_refs:
      - "openapi.yaml#/paths/~1projects/get"
    acceptance:
      - id: AC-010
        text: limit 與 offset 生效,未帶參數時預設 limit=20、offset=0
        verified_by: e2e
      - id: AC-011
        text: 回應帶上 total,其值為套用 status 篩選後、分頁前的總筆數
        verified_by: e2e
      - id: AC-012
        text: limit 超出 1..100 範圍時回 400,code 為 VALIDATION_ERROR
        verified_by: e2e

  - id: TASK-007
    title: 列表篩選參數的驗證 —— status 不在 enum 內要回 400
    owner: backend
    # 既有缺口,backend 做 TASK-004 時發現的。GET /projects?status=bogus 目前
    # 回 200 + 空列表:client 打錯字看起來像「沒有資料」,而不是「你問錯了」。
    #
    # 同一個 API 裡兩套標準:limit 超範圍回 400(AC-012),PATCH 的 status
    # 不在 enum 內也回 400(#56 實測),只有 GET 的 status filter 靜默吞掉。
    # 這跟 CR-001 裁決拒絕「{} 是一次成功但什麼都沒做的 PATCH」是同一個理由:
    # 靜默的錯誤來源比明確的失敗貴。
    #
    # openapi.yaml 的 400 已補上(#58),實作 #59,由 architect 實測:
    #   ?status=bogus                   400
    #   ?status=ACTIVE                  400(enum 大小寫敏感)
    #   ?status=active&status=archived  400(重複帶參數會拿到陣列)
    #   ?status=                        200,視同未帶 —— 契約定死的那一條
    # AC-013 的 e2e 測試 #63 已合併,check:ac 看得到覆蓋,狀態進 done。
    status: done
    depends_on: [TASK-006]
    contract_refs:
      - "openapi.yaml#/paths/~1projects/get"
    acceptance:
      - id: AC-013
        text: status 不在 ProjectStatus 的 enum 內時回 400,空字串則視同未帶此參數
        verified_by: e2e

  - id: TASK-008
    title: request body 的未定義欄位一律拒絕
    owner: backend
    # backend 做 TASK-005 時問出來的:PATCH 帶多餘欄位目前靜默忽略。
    # 實測 PATCH {"status":"archived","ownerEmail":"new@example.com"} → 200,
    # 而 ownerEmail 沒有變;POST {"name":"x","ownerEmial":"..."} 打錯欄位名
    # → 201,ownerEmail 是空的。兩個都是「成功了,但你要的事沒發生」。
    #
    # 這不是新原則,是第三個實例 —— CR-001 拒絕「{} 的空 PATCH」、TASK-007
    # 拒絕「?status=bogus 回空列表」,理由都是靜默的錯誤來源比明確的失敗貴。
    # 所以沒有開 CR 也沒有寫 ADR:套用既有決策不需要重新決策一次。
    #
    # 最具體的受害者是 ADR-004 自己造出來的:它明說改既有專案的 ownerEmail
    # 沒有路徑,於是 client 遲早會送 PATCH {"ownerEmail": ...}。
    #
    # contract 已改(additionalProperties: false),這張是把它實作出來。
    status: todo
    depends_on: [TASK-005]
    contract_refs:
      - "openapi.yaml#/components/schemas/UpdateProjectRequest"
      - "openapi.yaml#/components/schemas/CreateProjectRequest"
    acceptance:
      - id: AC-015
        text: POST 或 PATCH 的 body 出現 schema 未定義的欄位時回 400,不靜默忽略
        verified_by: e2e

  - id: TASK-009
    title: 壞掉的 JSON 也要回 Error schema,不要回 express 的 HTML
    owner: backend
    # 裁決 CR-012 時實測到的,不是 qa 報的:body 送一段語法錯誤的 JSON,
    # express 的 body-parser 會丟出來,預設錯誤處理器回一個 HTML 頁面。
    #
    #   POST /projects   body: {"name":        → 400  content-type: text/html
    #   PATCH /projects/xyz  body: {oops       → 400  content-type: text/html
    #
    # 狀態碼是對的,但 contract 說這個 400 的 content 是 application/json 的
    # Error —— 也就是說這條路徑上 API 違反自己的契約。CR-012 讓它更刺眼:
    # 一個回 HTML 的回應根本給不出 code。
    #
    # 修法是一個 express 錯誤處理器,把 body-parser 的解析錯誤轉成
    # { code: 'VALIDATION_ERROR', message: ... }。不需要新的 code 值。
    # contract 不必改 —— 契約本來就是這樣寫的,是實作沒有做到。
    status: todo
    depends_on: [TASK-008]
    contract_refs:
      - "openapi.yaml#/components/schemas/Error"
    acceptance:
      - id: AC-016
        text: body 為語法錯誤的 JSON 時回 400,且 body 是 Error schema(content-type 為 application/json)
        verified_by: e2e

