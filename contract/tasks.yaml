# 任務狀態機。用 YAML 而非 markdown,因為狀態與依賴需要能被腳本查詢。
#
# ⚠️  這支檔案是給腳本讀的,不是給 agent 整支讀的。查詢用:
#
#     pnpm task TASK-042                    # 一個任務
#     pnpm tasks --owner backend --status open
#
# 見 decisions/ADR-005-tasks-are-queried-not-read.md。同一份決策也規定
# **本檔只放資料** —— 決策理由住在 CR 或 ADR,用每個任務的 decisions: 欄位指過去。
#
# 欄位語意:
#   (沒有 status 欄位。done 與 blocked 是算出來的,todo / in_progress / review
#    這類意圖狀態不進 contract —— 見 decisions/ADR-007-status-is-derived-not-declared.md。
#    要看狀態跑 pnpm tasks,它會算給你,並顯示成 done / blocked / open (n/m AC)。)
#   verified_by   e2e | manual —— 規格由 CR-006 裁決,執行者是 scripts/check-ac.mjs
#                 (刻意沒有 none,理由見該腳本的檔頭)
#   verified_note manual 專用:為什麼自動化測不到
#   verified_record  manual 專用,進 done 時必填:at / who / commit / saw
#                 規格與四個欄位的意義見 CR-011 的裁決
#   decisions     這張任務的理由住在哪(相對 repo 根目錄的路徑)

tasks:
  - id: TASK-001
    title: 建立專案 API
    owner: backend
    depends_on: []
    contract_refs:
      - "openapi.yaml#/paths/~1projects/post"
    acceptance:
      - id: AC-001
        text: 新專案建立後回 201,狀態為 active,且含 id 與 createdAt
        verified_by: e2e
      - id: AC-002
        text: 名稱為空或全空白時回 400,code 為 VALIDATION_ERROR
        verified_by: e2e

  - id: TASK-002
    title: 專案列表與單筆查詢
    owner: backend
    depends_on: [TASK-001]
    contract_refs:
      - "openapi.yaml#/paths/~1projects/get"
      - "openapi.yaml#/paths/~1projects~1{projectId}/get"
    acceptance:
      - id: AC-003
        text: 建立後的專案可於列表查得
        verified_by: e2e
      - id: AC-004
        text: 查詢不存在的 id 回 404,code 為 NOT_FOUND
        verified_by: e2e

  - id: TASK-003
    title: 專案列表畫面
    owner: frontend
    decisions:
      - "change-requests/CR-006.md"
      - "change-requests/CR-011.md"
    depends_on: []   # 對 contract 開發,不需等 backend
    contract_refs:
      - "openapi.yaml#/components/schemas/Project"
    acceptance:
      - id: AC-005
        text: 顯示名稱、狀態、建立日期
        verified_by: manual
        verified_note: 黑箱 e2e 只 spawn backend 發 HTTP,打不到畫面;見 CR-006
        verified_record:
          at: 2026-09-01
          who: zozo0526
          commit: 533874a
          saw: 用 pnpm dev:frontend 建立「ruggetch v2」後,列表該筆同時顯示名稱 ruggetch v2、狀態 ACTIVE、建立日期 2026/9/1
      - id: AC-006
        text: 無資料時顯示空狀態
        verified_by: manual
        verified_note: 空狀態是純畫面的條件,改寫成 API 層的斷言就不是原本那條 AC 了
        verified_record:
          at: 2026-09-01
          who: zozo0526
          commit: 533874a
          saw: 剛啟動、尚未建立任何專案時,列表位置顯示斜體的「尚無專案」四個字(不是空白區塊)

  - id: TASK-004
    title: 專案封存功能
    owner: backend
    decisions:
      - "change-requests/CR-001.md"
    depends_on: [TASK-002]
    contract_refs:
      - "openapi.yaml#/paths/~1projects~1{projectId}/patch"
    acceptance:
      - id: AC-007
        text: 封存後狀態變為 archived,且不出現在 status=active 的列表中
        verified_by: e2e

  - id: TASK-005
    title: 專案負責人通知
    owner: backend
    decisions:
      - "contract/decisions/ADR-004-observable-side-effects.md"
    depends_on: [TASK-002]
    contract_refs:
      - "openapi.yaml#/paths/~1projects~1{projectId}/patch"
      - "openapi.yaml#/components/schemas/Project"
    acceptance:
      - id: AC-008
        text: 設有 ownerEmail 的專案狀態異動後,回應的 lastNotifiedAt 更新為該次通知時間
        verified_by: e2e
      - id: AC-009
        text: 未設 ownerEmail 時略過通知,PATCH 仍回 200 且不出現 lastNotifiedAt
        verified_by: e2e
      - id: AC-014
        text: 狀態未實際改變(如 active 改為 active)時不通知,lastNotifiedAt 不變
        verified_by: e2e

  - id: TASK-006
    title: 列表分頁實作(CR-003 階段二)
    owner: backend
    depends_on: [TASK-002]
    contract_refs:
      - "openapi.yaml#/paths/~1projects/get"
    acceptance:
      - id: AC-010
        text: limit 與 offset 生效,未帶參數時預設 limit=20、offset=0
        verified_by: e2e
      - id: AC-011
        text: 回應帶上 total,其值為套用 status 篩選後、分頁前的總筆數
        verified_by: e2e
      - id: AC-012
        text: limit 超出 1..100 範圍時回 400,code 為 VALIDATION_ERROR
        verified_by: e2e

  - id: TASK-007
    title: 列表篩選參數的驗證 —— status 不在 enum 內要回 400
    owner: backend
    decisions:
      - "contract/decisions/ADR-006-no-silent-acceptance.md"
    depends_on: [TASK-006]
    contract_refs:
      - "openapi.yaml#/paths/~1projects/get"
    acceptance:
      - id: AC-013
        text: status 不在 ProjectStatus 的 enum 內時回 400,空字串則視同未帶此參數
        verified_by: e2e

  - id: TASK-008
    title: request body 的未定義欄位一律拒絕
    owner: backend
    decisions:
      - "contract/decisions/ADR-006-no-silent-acceptance.md"
      - "contract/decisions/ADR-004-observable-side-effects.md"
    depends_on: [TASK-005]
    contract_refs:
      - "openapi.yaml#/components/schemas/UpdateProjectRequest"
      - "openapi.yaml#/components/schemas/CreateProjectRequest"
    acceptance:
      - id: AC-015
        text: POST 或 PATCH 的 body 出現 schema 未定義的欄位時回 400,不靜默忽略
        verified_by: e2e

  - id: TASK-009
    title: 壞掉的 JSON 也要回 Error schema,不要回 express 的 HTML
    owner: backend
    decisions:
      - "contract/decisions/ADR-006-no-silent-acceptance.md"
      - "change-requests/CR-012.md"
    depends_on: [TASK-008]
    contract_refs:
      - "openapi.yaml#/components/schemas/Error"
    acceptance:
      - id: AC-016
        text: body 為語法錯誤的 JSON 時回 400,且 body 是 Error schema(content-type 為 application/json)
        verified_by: e2e

  - id: TASK-010
    title: body 超過大小上限時回 413 + Error schema
    owner: backend
    decisions:
      - "contract/decisions/ADR-006-no-silent-acceptance.md"
      - "change-requests/CR-012.md"
    depends_on: [TASK-009]
    contract_refs:
      - "openapi.yaml#/paths/~1projects/post"
      - "openapi.yaml#/components/schemas/Error"
    acceptance:
      - id: AC-017
        text: request body 超過大小上限時回 413,body 是 Error schema 且 code 為 PAYLOAD_TOO_LARGE
        verified_by: e2e

  - id: TASK-011
    title: 已宣告的操作只在宣告的路徑上提供 —— 大小寫與結尾斜線都算
    owner: backend
    decisions:
      - "contract/decisions/ADR-006-no-silent-acceptance.md"
    depends_on: []
    contract_refs:
      - "openapi.yaml#/paths/~1projects/get"
    acceptance:
      - id: AC-018
        text: /Projects、/PROJECTS、/projects/ 等大小寫或結尾斜線不同的路徑不得回傳成功的專案列表
        verified_by: e2e

