# 任務狀態機。用 YAML 而非 markdown,因為狀態與依賴需要能被腳本查詢。
# status: todo | in_progress | blocked | review | done
#
# 每一條 acceptance 必須宣告 verified_by,見 change-requests/CR-006.md:
#   e2e    — 由 e2e/*.spec.ts 自動驗收。任務進入 done 時,scripts/check-ac.mjs
#            會要求 e2e 裡找得到這個 AC 編號,找不到就紅。
#   manual — 黑箱 e2e 架構上打不到(例如純畫面的驗收)。必須附 verified_note
#            寫明為什麼,讓「這條沒有自動化測試」是讀得到的事實而不是默契。
#
# 刻意沒有 "none" 這個值。少寫一條測試不會讓 CI 變紅,它讓 CI 變得更綠 ——
# 這種漂移是單向的,給一個零成本的逃生門等於把它制度化。

# verified_by: manual 的 AC,在任務進入 done 時必須附一筆 verified_record
# (CR-011 裁決)。verified_note 記的是「為什麼自動化測不到」,verified_record
# 記的是「那次人工驗收發生過」—— 兩件事,不共用欄位。
#
#   verified_record:
#     at: 2026-09-01          # 驗收日期
#     who: zozo0526           # 誰驗的
#     commit: 48dc54a         # 驗的是哪個版本 —— 沒有這個欄位,紀錄會靜默過期
#     saw: 建一筆後列表顯示名稱、active、2026/9/1
#
# saw 寫的是**看到什麼**,不是複述 text。複述等於沒驗,check:ac 會擋。
#
# 這筆紀錄擋的是「忘了驗就標 done」,擋不住假簽 —— 那層是 CODEOWNERS 要求的
# 人類 review。也別把它做得更重(截圖、簽章):成本落在每一次驗收,擋到的
# 東西不會比「有沒有這筆紀錄」多。
#
# commit 讓過期變成可偵測的:owner 的路徑在那個 commit 之後改過,這筆紀錄就
# 不再對應現在的程式碼。那是提醒不是紅燈 —— 人工複驗要花人的時間,每次改
# frontend 都紅會製造噪音,而噪音的下場是被繞掉。代價要說清楚:**manual 的
# done 是快照,e2e 的 done 是活的**,兩者強度不同。

tasks:
  - id: TASK-001
    title: 建立專案 API
    owner: backend
    status: done
    depends_on: []
    contract_refs:
      - "openapi.yaml#/paths/~1projects/post"
    acceptance:
      - id: AC-001
        text: 新專案建立後回 201,狀態為 active,且含 id 與 createdAt
        verified_by: e2e
      - id: AC-002
        text: 名稱為空或全空白時回 400,code 為 VALIDATION_ERROR
        verified_by: e2e

  - id: TASK-002
    title: 專案列表與單筆查詢
    owner: backend
    status: done
    depends_on: [TASK-001]
    contract_refs:
      - "openapi.yaml#/paths/~1projects/get"
      - "openapi.yaml#/paths/~1projects~1{projectId}/get"
    acceptance:
      - id: AC-003
        text: 建立後的專案可於列表查得
        verified_by: e2e
      - id: AC-004
        text: 查詢不存在的 id 回 404,code 為 NOT_FOUND
        verified_by: e2e

  - id: TASK-003
    title: 專案列表畫面
    owner: frontend
    # AC-005/AC-006 已於 2026-09-01 人工驗收,紀錄見下面的 verified_record
    # (制度的第一筆)。仍是 review 而不是 done,原因換了:CR-011 裁決要求
    # check:ac 先能驗這筆紀錄,規則到位之前翻 done 等於這個狀態沒有被任何
    # 機制把關過 —— 那正是 CR-006 與 CR-011 兩張連續在講的同一件事。
    status: review
    depends_on: []   # 對 contract 開發,不需等 backend
    contract_refs:
      - "openapi.yaml#/components/schemas/Project"
    acceptance:
      - id: AC-005
        text: 顯示名稱、狀態、建立日期
        verified_by: manual
        verified_note: 黑箱 e2e 只 spawn backend 發 HTTP,打不到畫面;見 CR-006
        verified_record:
          at: 2026-09-01
          who: zozo0526
          commit: 533874a
          saw: 用 pnpm dev:frontend 建立「ruggetch v2」後,列表該筆同時顯示名稱 ruggetch v2、狀態 ACTIVE、建立日期 2026/9/1
      - id: AC-006
        text: 無資料時顯示空狀態
        verified_by: manual
        verified_note: 空狀態是純畫面的條件,改寫成 API 層的斷言就不是原本那條 AC 了
        verified_record:
          at: 2026-09-01
          who: zozo0526
          commit: 533874a
          saw: backend 為 in-memory,剛啟動尚未建立任何專案時,列表區塊沒有列出任何項目

  - id: TASK-004
    title: 專案封存功能
    owner: backend
    # CR-001 已 accepted,PATCH /projects/{projectId} 就緒,解除阻擋。
    status: todo
    depends_on: [TASK-002]
    contract_refs:
      - "openapi.yaml#/paths/~1projects~1{projectId}/patch"
    acceptance:
      - id: AC-007
        text: 封存後狀態變為 archived,且不出現在 status=active 的列表中
        verified_by: e2e

  - id: TASK-005
    title: 專案負責人通知
    owner: backend
    # CR-003 已 accepted 並完成階段一,limit/offset 就緒,解除阻擋。
    status: todo
    depends_on: [TASK-002]
    contract_refs:
      - "openapi.yaml#/components/schemas/Project"
    acceptance:
      - id: AC-008
        text: 專案狀態異動時,寄出通知至 ownerEmail
        verified_by: e2e
      - id: AC-009
        text: ownerEmail 未設定時略過通知,不得報錯
        verified_by: e2e

  - id: TASK-006
    title: 列表分頁實作(CR-003 階段二)
    owner: backend
    status: done   # 實作見 #9,驗收測試見 #11
    depends_on: [TASK-002]
    contract_refs:
      - "openapi.yaml#/paths/~1projects/get"
    acceptance:
      - id: AC-010
        text: limit 與 offset 生效,未帶參數時預設 limit=20、offset=0
        verified_by: e2e
      - id: AC-011
        text: 回應帶上 total,其值為套用 status 篩選後、分頁前的總筆數
        verified_by: e2e
      - id: AC-012
        text: limit 超出 1..100 範圍時回 400,code 為 VALIDATION_ERROR
        verified_by: e2e
