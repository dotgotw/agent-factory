openapi: 3.0.3
info:
  title: Projects API
  version: 2.2.0
  description: |
    唯一 API 真相。Frontend 與 Backend 的型別皆由此檔生成。
    任何修改必須由 Architect 執行,並附帶一份 change-requests/CR-*.md。

    **本契約描述它宣告的操作,不描述未宣告的路徑。** 打到這裡沒有列出的
    路徑時會發生什麼事,不是本檔的保證範圍 —— 一份契約沒有辦法枚舉、
    也沒有辦法驗證它自己路徑集合的補集。要讓「所有錯誤都是 Error」成為
    全 API 的保證,那是另一個決定,不能當成 bug 修進來。

    **反過來這一半是保證的:已宣告的操作只在它宣告的那個路徑上提供。**
    路徑逐字元比對 —— 大小寫算數,結尾的斜線也算數。`/Projects` 與
    `/projects/` 不是這份契約裡的東西,不該回一個成功的回應。

    兩半合起來才是完整的意思:契約不管未宣告的路徑**回什麼**,但它管
    未宣告的路徑**不可以回一個宣告過的成功回應** —— 否則就是在契約之外
    長出一片沒有人寫下來、client 卻依賴得到的相容面。

servers:
  - url: http://localhost:3000
    description: local
  - url: https://staging.example.com
    description: staging

paths:
  /projects:
    get:
      operationId: listProjects
      summary: 列出目前租戶的所有專案
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  total:
                    type: integer
                    description: |
                      符合篩選條件的總筆數(分頁前),用於前端計算頁數。
                      必填 —— 見 change-requests/CR-003.md 階段三。
        # 這個 400 在實作與 e2e 裡早就存在(AC-012 的 limit/offset 驗證),
        # 只是從來沒有寫進 contract —— 而 check:drift 只比對生成的型別,
        # 看不見「回應碼漏寫」。補上,並一併涵蓋 status。
        '400':
          description: |
            查詢參數驗證失敗。limit 不在 1..100、offset 為負數,
            或 status 不在 ProjectStatus 的 enum 內。

            status 給空字串等同未帶此參數(不篩選),不是驗證失敗 ——
            client 無條件串上 `&status=` 是常見寫法,為此回 400 不划算。

            code 一律為 `VALIDATION_ERROR`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProject
      summary: 建立專案
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: 驗證失敗(name 不合規,或 body 出現未定義的欄位)。code 為 `VALIDATION_ERROR`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |
            request body 超過伺服器允許的大小。code 為 `PAYLOAD_TOO_LARGE`。

            **上限的數值不寫進契約** —— 那是部署與實作的選擇(見 AGENTS.md
            對 infra 的分界)。契約保證的是「超過時回 413 且 body 是 Error」,
            不是「上限剛好是多少」。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{projectId}:
    get:
      operationId: getProject
      summary: 取得單一專案
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: 找不到。code 為 `NOT_FOUND`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateProject
      summary: 更新專案狀態(封存 / 取消封存)
      description: |
        狀態**實際改變**且該專案設有 ownerEmail 時,會就這次異動通知負責人,
        並把 Project.lastNotifiedAt 更新為交付時間。

        三個刻意的行為,見 decisions/ADR-004-observable-side-effects.md:

        - **狀態沒有真的改變(例如 active → active)不通知。** 否則一個
          重試的 client 會反覆騷擾負責人,而那不是「狀態異動」。
        - **沒有 ownerEmail 就略過通知,且不視為錯誤。** 回應仍是 200,
          只是沒有 lastNotifiedAt。
        - **通知失敗不會讓這個 PATCH 失敗。** 這支 API 的職責是改狀態;
          通知是它的副作用,不是它的前提。失敗時 lastNotifiedAt 不更新 ——
          於是「沒通知成功」一樣是看得見的。
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: OK,回傳更新後的專案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: 驗證失敗(status 缺漏、不在 enum 內,或 body 出現未定義的欄位)。code 為 `VALIDATION_ERROR`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |
            request body 超過伺服器允許的大小。code 為 `PAYLOAD_TOO_LARGE`。

            **上限的數值不寫進契約** —— 那是部署與實作的選擇(見 AGENTS.md
            對 infra 的分界)。契約保證的是「超過時回 413 且 body 是 Error」,
            不是「上限剛好是多少」。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 找不到。code 為 `NOT_FOUND`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ProjectStatus:
      type: string
      enum: [active, archived]

    Project:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        createdAt:
          type: string
          format: date-time
        ownerEmail:
          type: string
          format: email
          description: 專案負責人信箱。選填,見 change-requests/CR-002.md
        lastNotifiedAt:
          type: string
          format: date-time
          readOnly: true
          description: |
            最後一次「就狀態異動通知 ownerEmail」成功交付給寄送機制的時間。
            未曾通知過就不存在這個欄位。

            這是通知這件事在 contract 上的**唯一可觀察面**,見
            decisions/ADR-004-observable-side-effects.md。它記的是「已交付給
            寄送機制」,不是「對方收到了」——後者不在本 API 的能力範圍內,
            不要讓這個欄位假裝它知道。

            唯讀:不出現在任何 request schema 裡,只由狀態異動產生。

    CreateProjectRequest:
      type: object
      required: [name]
      # 未定義的欄位一律拒絕,不靜默忽略。理由見 UpdateProjectRequest。
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        ownerEmail:
          type: string
          format: email
          description: |
            選填。CR-002 把 ownerEmail 加進 Project 的回應,但沒有給它任何
            寫入路徑 —— 於是那個欄位永遠是空的,而 TASK-005 的驗收踩到了
            這個洞。建立時可設是最小的補法。

            **改既有專案的 ownerEmail 目前沒有路徑**,那要動
            UpdateProjectRequest 的 required: [status],等有需求再開 CR ——
            見 ADR-004「不在範圍」。

    UpdateProjectRequest:
      type: object
      # 未定義的欄位一律拒絕(回 400),不靜默忽略。
      #
      # 這不是新原則,是既有原則的第三個實例:CR-001 裁決拒絕「{} 是一次
      # 成功但什麼都沒做的 PATCH」,TASK-007 拒絕「?status=bogus 回空列表」,
      # 兩次的理由都是**靜默的錯誤來源比明確的失敗貴**。
      #
      # 這個實例最具體的受害者是 ADR-004 自己造出來的:那份決策明說「改既有
      # 專案的 ownerEmail 目前沒有路徑」,於是 client 遲早會送
      # PATCH {"ownerEmail": "..."}。靜默忽略的話它拿到 200、負責人沒有變,
      # 而它沒有任何辦法知道。實測確認過目前就是這個行為。
      #
      # 代價要說清楚:additionalProperties: false 讓「新 client 對舊 server
      # 送新欄位」從「被忽略」變成「400」。在這個 repo 是可接受的 ——
      # 前後端同一個 commit 部署,沒有版本落差;真的出現落差的那天,
      # 要處理的是部署方式,不是把驗證放寬。
      additionalProperties: false
      # status 刻意設為必填 —— 這個 body 目前只有一個欄位,設為選填的話
      # `{}` 會變成一次「成功但什麼都沒做」的 PATCH,是靜默的錯誤來源。
      # 日後若新增其他可更新欄位,把 status 移出 required 即可 —— 放寬
      # request 的限制對既有 client 是相容的,方向是安全的那一邊。
      # 見 change-requests/CR-001.md。
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          # 列舉而不是開放字串:code 是 client 拿來分支的東西,開放的話新值可以
          # 悄悄長出來,而 client 的 switch 不會有人提醒它漏了一個 case。
          # 加第三個值是一次 contract 變更 + 一次型別重新生成 —— 本來就該被看見。
          # 見 change-requests/CR-012.md 的裁決。
          enum: [VALIDATION_ERROR, NOT_FOUND, PAYLOAD_TOO_LARGE]
        message:
          type: string
