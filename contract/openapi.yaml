openapi: 3.0.3
info:
  title: Projects API
  version: 2.1.0
  description: |
    唯一 API 真相。Frontend 與 Backend 的型別皆由此檔生成。
    任何修改必須由 Architect 執行,並附帶一份 change-requests/CR-*.md。

servers:
  - url: http://localhost:3000
    description: local
  - url: https://staging.example.com
    description: staging

paths:
  /projects:
    get:
      operationId: listProjects
      summary: 列出目前租戶的所有專案
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  total:
                    type: integer
                    description: |
                      符合篩選條件的總筆數(分頁前),用於前端計算頁數。
                      必填 —— 見 change-requests/CR-003.md 階段三。
        # 這個 400 在實作與 e2e 裡早就存在(AC-012 的 limit/offset 驗證),
        # 只是從來沒有寫進 contract —— 而 check:drift 只比對生成的型別,
        # 看不見「回應碼漏寫」。補上,並一併涵蓋 status。
        '400':
          description: |
            查詢參數驗證失敗。limit 不在 1..100、offset 為負數,
            或 status 不在 ProjectStatus 的 enum 內。

            status 給空字串等同未帶此參數(不篩選),不是驗證失敗 ——
            client 無條件串上 `&status=` 是常見寫法,為此回 400 不划算。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProject
      summary: 建立專案
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: 驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{projectId}:
    get:
      operationId: getProject
      summary: 取得單一專案
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: 找不到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateProject
      summary: 更新專案狀態(封存 / 取消封存)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: OK,回傳更新後的專案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: 驗證失敗(status 缺漏或不在 enum 內)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 找不到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ProjectStatus:
      type: string
      enum: [active, archived]

    Project:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        createdAt:
          type: string
          format: date-time
        ownerEmail:
          type: string
          format: email
          description: 專案負責人信箱。選填,見 change-requests/CR-002.md

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80

    UpdateProjectRequest:
      type: object
      # status 刻意設為必填 —— 這個 body 目前只有一個欄位,設為選填的話
      # `{}` 會變成一次「成功但什麼都沒做」的 PATCH,是靜默的錯誤來源。
      # 日後若新增其他可更新欄位,把 status 移出 required 即可 —— 放寬
      # request 的限制對既有 client 是相容的,方向是安全的那一邊。
      # 見 change-requests/CR-001.md。
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
