# 一個 package 一個 manifest —— 依賴關係從默契變成 diff(CR-009 / ADR-003)。
#
# 這一步只是把 package 建起來,舊的相對路徑 import 仍然可用,兩種寫法並存。
# 邊界要到第 5 步(各 tsconfig 的 rootDir + check-boundaries)才真正關上。
#
# generated 也在裡面:它是 @af/contract,由 gen-types.sh 產出,不是誰手寫的。
# 已知代價(ADR-003 已接受):check:drift 的 `rm -rf generated` 期間,
# node_modules/@af/contract 會短暫指向不存在的目錄 —— 生成器失敗時,本機的
# typecheck 會以「找不到 @af/contract」失敗,而真正的原因在上一步。
# 再跑一次 pnpm gen:types 即可。
packages:
  - backend
  - frontend
  - e2e
  - generated
